<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rebuske · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ebano:#191F15;--noche:#3E4C35;--bosque:#4E8839;--lima:#B8FF3B;--gy:#AFFF3E;--canario:#FFFA70;--tinta:#F2F5EC;--mut:rgba(242,245,236,.66)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',system-ui,sans-serif;background:#0b0f08;color:var(--tinta);min-height:100dvh;display:flex;align-items:center;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
button{transition:transform .15s,opacity .2s;position:relative;cursor:pointer}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--lima);outline-offset:2px}
#app{position:relative;width:100%;max-width:430px;height:100dvh;max-height:920px;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 55% at 50% 0%,var(--noche),var(--ebano) 60%,#131a0f)}
#app::before{content:'';position:absolute;inset:-35%;background:conic-gradient(from 0deg,rgba(184,255,59,.2),transparent 22%,rgba(78,136,57,.4),transparent 50%,rgba(175,255,62,.18),transparent 75%,rgba(184,255,59,.2));filter:blur(64px);opacity:.45;animation:spin 46s linear infinite;pointer-events:none}
@media(min-width:500px){#app{border-radius:36px;box-shadow:0 0 0 8px #000,0 18px 50px rgba(0,0,0,.38)}}
#view{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 16px}
#view>*{flex-shrink:0}
/* Menú inferior fijo: cinco posiciones, "+" elevado, se encoge al bajar */
#nav{position:relative;z-index:3;flex:none;padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
#nav:empty{display:none}
.bar{position:relative;display:flex;align-items:center;justify-content:space-between;height:72px;border-radius:28px;background:rgba(30,38,26,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);transition:height .45s cubic-bezier(.2,.8,.2,1),border-radius .45s}
#nav.min .bar{height:56px;border-radius:24px}
.ni{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;font-size:11px;color:var(--mut);position:relative;transition:color .3s}
.ni span{display:block;max-height:20px;overflow:hidden;white-space:nowrap;transition:max-height .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
.ni.on{color:var(--lima)}
.ni.on::after{content:'';position:absolute;bottom:6px;width:22px;height:4px;border-radius:4px;background:var(--lima);box-shadow:0 0 8px var(--lima)}
#nav.min .ni span{max-height:0;opacity:0}
.nplus{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gy),var(--lima));color:#111;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(20,26,16,.95),0 0 30px rgba(184,255,59,.5);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#nav.min .nplus{transform:translateX(-50%) scale(.92)}
#toast{position:absolute;z-index:6;left:16px;right:16px;bottom:104px;background:var(--gy);color:#111;border-radius:100px;padding:12px 18px;font-weight:600;font-size:15px;text-align:center;opacity:0;transform:translateY(12px) scale(.96);transition:.35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#toast.on{opacity:1;transform:none}
.sheet{position:absolute;inset:0;z-index:5;background:rgba(10,14,8,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end}
.sheet.on{display:flex;animation:fadeIn .25s both}
.panel{width:100%;max-height:86%;overflow-y:auto;border-radius:28px 28px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 22px);background:linear-gradient(180deg,rgba(62,76,53,.97),rgba(25,31,21,.98));border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:12px;animation:slide .35s cubic-bezier(.2,.7,.2,1) both}
h1{font-size:22px;font-weight:800;line-height:1.1}
h2{font-size:17px;font-weight:700;margin-top:6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-weight:400}
small{display:block;font-size:13px;color:var(--mut);line-height:1.3}
.mut{color:var(--mut)}.lima{color:var(--lima)}.w{color:var(--canario)}.txtc{text-align:center}
.big{font-size:34px;font-weight:800;line-height:1;white-space:nowrap}
.hd{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.ico{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);display:grid;place-items:center;position:relative}
.ico.lima{background:var(--lima);color:#111;border-color:transparent}
.bdot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--lima);box-shadow:0 0 8px var(--lima);animation:pulse2 2s infinite}
.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:up .5s cubic-bezier(.2,.7,.2,1) both}
button.glass{width:100%;text-align:left;display:flex;gap:12px;align-items:center}
button.glass svg{color:var(--lima);flex:none}
.btn{display:block;width:100%;background:var(--gy);color:#111;font-weight:700;font-size:17px;border:0;border-radius:100px;padding:13px 16px;text-align:center}
.btn.ghost{background:transparent;color:var(--tinta);border:1.5px solid rgba(255,255,255,.35)}
.btn.sm{padding:10px 12px;font-size:15px}
.btn.sheen{background:linear-gradient(100deg,#AFFF3E 30%,#EEFFC2 50%,#AFFF3E 70%);background-size:220% 100%;animation:sheen 4.5s ease-in-out infinite}
.btn:disabled{cursor:default}
.cta{overflow:hidden}
.cta .lb{transition:opacity .2s}
.cta .sp,.cta .ck{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .25s}
.cta .sp{width:22px;height:22px;border-radius:50%;border:3px solid rgba(17,17,17,.25);border-top-color:#111;animation:spin .8s linear infinite}
.cta .ck{width:26px;height:26px}
.cta .ck path{stroke-dasharray:1;stroke-dashoffset:1}
.cta.load{animation:none}
.cta.load .lb,.cta.done .lb{opacity:0}
.cta.load .sp{opacity:1}
.cta.done{background:var(--lima);animation:none}
.cta.done .ck{opacity:1}
.cta.done .ck path{animation:draw .5s ease forwards}
.link{background:none;border:0;color:var(--lima);font-size:14px;text-decoration:underline;padding:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{align-self:flex-start;font-size:12px;font-weight:600;color:var(--lima);border:1px solid var(--lima);border-radius:100px;padding:2px 10px;background:rgba(184,255,59,.08);white-space:nowrap}
.tag2{align-self:flex-start;font-size:12px;color:var(--tinta);border:1px solid rgba(255,255,255,.2);border-radius:100px;padding:2px 10px;white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;color:var(--lima);border:1px dashed rgba(255,250,112,.6);color:var(--canario);border-radius:100px;padding:5px 12px}
.stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.ctr{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:12px 0}
.ctr.full{flex:1}.ctr.sm{padding:6px 0}
.legal{display:flex;gap:16px;font-size:13px;color:var(--mut);justify-content:center}
/* Logo 3D con brillo pulsante */
.hero{position:relative;width:var(--s);height:var(--s);display:grid;place-items:center;margin:0 auto}
.hero .l3d{width:calc(var(--s)*.92)}
.hero.ring::before{content:'';position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,rgba(184,255,59,.3) 75%,var(--lima));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:spin 1.6s linear infinite}

.intro .hero .l3d{animation:fadeIn 1.2s both,breathe 3.2s 1.2s ease-in-out infinite}
.wm{font-weight:800;font-size:60px;line-height:1;letter-spacing:-.02em;display:flex}
.wm.sm{font-size:46px}
.wm span{display:inline-block;opacity:0;animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*70ms + 300ms)}
.wm .lima{color:var(--lima)}
.fade{animation:fadeIn 1s 1.4s both}
.lz{width:40px;height:auto;overflow:visible;flex:none}
.lz.lg{width:64px}
.mini{width:15px;height:15px;vertical-align:-3px;margin-left:5px;animation:badge .7s cubic-bezier(.2,1.5,.4,1) both}
.av{border-radius:50%;background:linear-gradient(135deg,var(--gy),var(--lima));color:#111;display:grid;place-items:center;font-weight:800;flex:none}
.search{width:100%;display:flex;gap:10px;align-items:center;padding:13px 18px;border-radius:100px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);text-align:left}
.sr{display:flex;flex-direction:row;gap:10px;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:100px;padding:0 16px;color:var(--mut)}
.sr input{border:0;background:none;padding:13px 0;font-size:16px;flex:1;outline:none;color:var(--tinta)}
.sr input::placeholder{color:rgba(242,245,236,.5)}
.zones{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.zones::-webkit-scrollbar{display:none}
.chip2{flex:none;font-size:14px;font-weight:600;padding:8px 14px;border-radius:100px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);white-space:nowrap}
.chip2.on{border-color:var(--lima);color:var(--lima);background:rgba(184,255,59,.1)}
.vault{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 40px 10px;margin:0 -16px;scrollbar-width:none}
.vault::-webkit-scrollbar{display:none}
.vc{flex:none;width:98px;scroll-snap-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;transform:scale(var(--s,1));opacity:var(--o,1);transition:transform .15s,opacity .15s}
.vc i{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(184,255,59,.28),rgba(78,136,57,.45));color:var(--lima);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.banner{display:flex;gap:12px;align-items:center}
.banner b{display:block;font-size:16px}
.pc{display:flex;gap:12px;align-items:center;width:100%}
.clk{cursor:pointer}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right;flex:none}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats3 b{font-size:20px;display:block;color:var(--lima)}
.ficha{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.txt{font-size:15px;line-height:1.45}
.port{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.port div{height:112px;border-radius:18px;padding:10px;display:flex;align-items:flex-end;font-size:13px;position:relative;overflow:hidden;background:linear-gradient(135deg,#2c3924,#3E4C35 50%,#2a3a22)}
.port div:nth-child(2){background:linear-gradient(135deg,#4E8839,#B8FF3B 140%);color:#111}
.port div:nth-child(3){background:linear-gradient(160deg,#1f2a18,#4E8839)}
.port div:nth-child(4){background:linear-gradient(120deg,#3E4C35,#2b3821 60%,#B8FF3B 150%)}
.port div::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-100%);animation:shine 4s ease-in-out infinite}
.pcard{display:flex;gap:12px;align-items:flex-start;animation:up .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0)*160ms + 200ms)}
.msg{font-size:14px;color:var(--mut);margin:4px 0}
.sticky{position:sticky;bottom:0;margin-top:auto;padding:12px 0 6px;background:linear-gradient(180deg,rgba(19,26,15,0),rgba(19,26,15,.96) 30%)}
.sticky.row2{grid-template-columns:.75fr 1.25fr}
.sticky .btn{white-space:nowrap;font-size:14px;padding:12px 8px}
.req{display:flex;flex-direction:column;gap:10px}
.ibox{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;background:rgba(184,255,59,.1);border:1px solid rgba(184,255,59,.25);color:var(--lima)}
/* Ruta de Luz: línea de tiempo con luz que recorre los nodos */
.tl{position:relative;display:flex;flex-direction:column;gap:16px;padding:18px 18px 18px 22px}
.tl::before{content:'';position:absolute;left:31px;top:30px;bottom:30px;width:2px;background:rgba(255,255,255,.12)}
.tl .fill{position:absolute;left:31px;top:30px;width:2px;height:var(--h);background:linear-gradient(180deg,var(--lima),var(--bosque));box-shadow:0 0 10px var(--lima);transition:height 1.1s cubic-bezier(.2,.7,.2,1)}
.st{display:flex;gap:14px;align-items:flex-start;position:relative;opacity:.45;transition:opacity .6s}
.st.on{opacity:1}
.st .nd{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.3);flex:none;display:grid;place-items:center;background:var(--ebano);margin-top:1px}
.st.on .nd{border-color:var(--lima);background:var(--lima);box-shadow:0 0 14px var(--lima);animation:glow 2.4s ease-in-out infinite}
.st.on .nd::after{content:'';width:6px;height:6px;border-radius:50%;background:#111}
.st b{display:block;font-size:16px}
.track{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.track i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--bosque),var(--gy),var(--lima));box-shadow:0 0 14px var(--lima);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.stars{display:flex;justify-content:center;gap:10px}
.stars button{background:none;border:0;color:rgba(255,255,255,.25)}
.stars button.on{color:var(--lima)}
.stars button.on svg{fill:currentColor}
.okc{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,var(--gy),var(--lima));color:#111;display:grid;place-items:center;box-shadow:0 0 40px rgba(184,255,59,.5);animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.chk path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s .35s ease forwards}
.quote{display:flex;flex-direction:column;gap:6px;border-color:rgba(184,255,59,.45)}
.wallet{background:linear-gradient(135deg,rgba(184,255,59,.22),rgba(78,136,57,.3) 55%,rgba(25,31,21,.6));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.wallet .big{font-size:40px}
/* Gráfico: barras + línea que se dibuja */
.chart{position:relative;height:140px;display:flex;align-items:flex-end;gap:12px;margin-top:6px}
.chart .b{flex:1;height:0;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,rgba(184,255,59,.5),rgba(78,136,57,.4));animation:grow .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*90ms)}
.chart .b.hi{background:linear-gradient(180deg,var(--lima),var(--bosque))}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ln{fill:none;stroke:var(--lima);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .3s ease forwards;filter:drop-shadow(0 0 6px var(--lima))}
.dot{fill:var(--lima);opacity:0;animation:fadeIn .4s forwards}
.months{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:8px;padding:0 4px}
.months b{color:var(--lima)}
.prog{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--bosque),var(--lima));transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.switch{width:50px;height:28px;flex:none;border-radius:100px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.12);position:relative;transition:background .35s,box-shadow .35s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:left .4s cubic-bezier(.34,1.56,.64,1),background .3s}
.switch.on{background:var(--lima);box-shadow:0 0 18px rgba(184,255,59,.5)}
.switch.on::after{left:25px;background:#111}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs button,.seg button{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:100px;padding:9px 10px;font-weight:600;white-space:nowrap;font-size:14px}
.tabs button.on,.seg button.on{background:var(--lima);color:#111;border-color:var(--lima)}
.seg{display:flex;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;font-size:13px;font-weight:500;padding:7px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:100px}
.bub{max-width:80%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.3;transform-origin:bottom left;animation:bub .45s cubic-bezier(.2,.9,.3,1.2) both}
.bub.c{align-self:flex-end;background:var(--gy);color:#111;border-bottom-right-radius:6px;transform-origin:bottom right}
.bub.p{align-self:flex-start;background:rgba(255,255,255,.1);border-bottom-left-radius:6px}
.typing{align-self:flex-start;display:flex;gap:5px;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.1);border-bottom-left-radius:6px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--lima);animation:dot 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.blur{filter:blur(5px);user-select:none}
.msgs{display:flex;flex-direction:column;gap:8px}
.inbar{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:6px}
.inbar input{border-radius:100px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);padding:12px 16px;font-size:16px;width:100%;color:var(--tinta)}
.warnc{display:flex;gap:10px;align-items:flex-start;border-color:rgba(255,250,112,.5);background:rgba(255,250,112,.07)}
.warnc svg{color:var(--canario);flex:none}
.warnc small{color:var(--tinta)}
.list .row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px 0;border:0;border-bottom:1px solid rgba(255,255,255,.07);background:none;text-align:left;font-weight:600}
.list .row:last-child{border-bottom:0}
.list .row small{font-weight:400}
.rows>div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.rows>div:last-child{border:0}
.rc{display:inline-block;height:1em;overflow:hidden;vertical-align:bottom;line-height:1em}
.rt{display:flex;flex-direction:column;transition:transform 1.3s cubic-bezier(.2,.8,.2,1)}
.rt span{display:block;height:1em;line-height:1em}
.sel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 12px;font-size:15px;width:100%;color:var(--tinta)}
select option{color:#111}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:var(--mut)}
input.field,textarea{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;font-size:16px;width:100%;color:var(--tinta)}
textarea{resize:none}
.sum{display:flex;flex-direction:column;gap:6px}
.sum>div{display:flex;justify-content:space-between;align-items:baseline}
.scan{display:flex;gap:12px;align-items:center}
.scan .lz{animation:float 2.4s ease-in-out infinite}
.refp b{font-size:17px}
.stat-sm{font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes breathe{50%{filter:drop-shadow(0 0 34px rgba(184,255,59,.95))}}
@keyframes glow{50%{box-shadow:0 0 22px var(--lima)}}
@keyframes sheen{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes shine{0%,40%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{height:var(--h)}}
@keyframes badge{from{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.25) rotate(4deg)}}
@keyframes bub{from{transform:scale(.6) translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
@keyframes pulse2{50%{transform:scale(1.5);opacity:.6}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Rendimiento en celular: sin desenfoques ni brillos animados pesados */
#app::before{animation:none!important;filter:none!important;inset:0!important;background:radial-gradient(120% 60% at 50% 0%,rgba(184,255,59,.12),transparent 60%)!important}
.l3d{animation:none!important;filter:drop-shadow(0 0 10px rgba(184,255,59,.35))!important}
.intro .hero .l3d{animation:fadeIn 1.2s both!important}
.ln{filter:none!important}
.bdot{animation:none!important}
.glass,#nav .bar,.sheet,.panel{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#nav .bar{background:rgba(30,38,26,.97)!important}
/* Pantalla táctil: sin barras de desplazamiento visibles */
*{scrollbar-width:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
/* Logo 3D: sin brillo ni círculo; flota arriba y abajo */
.l3d{filter:none!important}
.hero .l3d{animation:float 3.2s ease-in-out infinite!important}
.intro .hero .l3d{animation:fadeIn 1.2s both!important}
.hero.ring::before{inset:-5px!important;background:conic-gradient(from 0deg,transparent 0 62%,rgba(184,255,59,.95) 100%)!important;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px))!important;mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px))!important;animation:spin 1.4s linear infinite!important}
/* Dentro de la app el logo ocupa la mitad */
.hero.half{width:calc(var(--s)/2)!important;height:calc(var(--s)/2)!important}
.hero.half .l3d{width:calc(var(--s)*.46)!important}
/* Botón con estado de carga: luciérnaga girando, centrada */
.cta .sp{left:50%!important;top:50%!important;width:34px!important;height:34px!important;margin:-17px 0 0 -17px!important;transform:none!important;border:0!important;border-radius:50%!important;background-color:#111!important;background-size:28px auto!important;animation:none!important;box-shadow:none!important}
/* Sin arco alrededor de la luciérnaga: queda como está */
.hero.ring::before{display:none!important;animation:none!important}
/* Carga en botón: luciérnaga en negro girando en 3D */
.cta .sp{background:none!important;background-color:transparent!important;border:0!important;width:30px!important;height:30px!important;margin:-15px 0 0 -15px!important;border-radius:0!important;animation:turn 1.8s linear infinite!important;box-shadow:none!important}
.cta .sp svg{width:100%;height:100%;display:block;filter:brightness(0)}
@keyframes turn{to{transform:rotateY(360deg)}}

<script>
const KEY='rebuske_demo_v4';
const P={home:'M3 11l9-7 9 7v9h-6v-6H9v6H3z',search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm9 16-4.5-4.5',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',bag:'M4 7h16v13H4zM9 7V4h6v3',bolt:'M13 2L4 14h7l-1 8 9-12h-7z',check:'M5 12l4 4 9-9',pin:'M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11zm0-8.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',wallet:'M3 7h15a3 3 0 0 1 3 3v7H3zM3 7l12-3v3',back:'M15 6l-6 6 6 6',arrow:'M4 12h14M13 6l6 6-6 6',chev:'M9 6l6 6-6 6',plus:'M12 5v14M5 12h14',bell:'M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0',card:'M3 6h18v12H3zM3 10h18',chat:'M4 5h16v11H9l-5 4z',cert:'M6 3h9l4 4v14H6zM9 12h6M9 16h6',out:'M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10',list:'M4 6h16M4 12h16M4 18h16',tool:'M14.5 6.5a4 4 0 0 0 5 5L12 19l-3-3 7.5-7.5z'};
const I=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;
const LZ=(c='')=>`<svg class="lz ${c}" viewBox="0 0 390 372" aria-hidden="true"><use href="#lz"/></svg>`;
const HERO=(s,ring)=>`<div class="hero ${ring?'ring':''}" style="--s:${s}px" role="img" aria-label="Luciérnaga Rebuske"><div class="l3d"></div></div>`;
const WM=c=>`<div class="wm ${c||''}" aria-label="rebuske">${[...'rebusk'].map((l,i)=>`<span style="--i:${i}">${l}</span>`).join('')}<span class="lima" style="--i:6">e</span></div>`;
const VER='<svg class="mini" viewBox="0 0 390 372" aria-label="Verificado"><use href="#lz"/></svg>';
const M=n=>'$'+Math.round(n).toLocaleString('es-CO');
const RL=s=>String(s).split('').map(ch=>/\d/.test(ch)?`<span class="rc" data-d="${ch}"><span class="rt">${'0123456789'.split('').map(n=>`<span>${n}</span>`).join('')}</span></span>`:`<span>${ch}</span>`).join('');
function rollInit(){document.querySelectorAll('.rc').forEach(c=>requestAnimationFrame(()=>{c.firstChild.style.transform=`translateY(-${c.dataset.d}em)`}))}
const cta=(label,a,attrs,st)=>`<button class="btn sheen cta ${st||''}" data-a="${a}" ${attrs||''} ${st?'disabled':''}><span class="lb">${label}</span><i class="sp"></i><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M5 12l4 4 9-9"/></svg></button>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const q=s=>document.querySelector(s);
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
const com=nv=>nv==='Oro'?.06:.07;
const CATS=[['Hogar','home'],['Reparaciones','tool'],['Vehículos','pin'],['Tecnología','shield'],['Personal','user'],['Eventos','star'],['Transporte','bag'],['Profesionales','wallet']];
const ZONAS=['Laureles','El Poblado','Belén','Centro','Envigado','Zona Norte','Aeropuerto'];
const REF=[['Limpieza','50.000 – 120.000'],['Plomería','80.000 – 180.000'],['Electricidad','70.000 – 160.000'],['Pintura','90.000 – 200.000']];
const PROS=[
{id:'p1',n:'Julián Restrepo',o:'Plomería',c:'Reparaciones',z:'Laureles',r:4.9,t:127,nv:'Plata',p:90000,y:9},
{id:'p2',n:'Marcela Gómez',o:'Limpieza',c:'Hogar',z:'Belén',r:4.8,t:203,nv:'Oro',p:40000,y:6},
{id:'p3',n:'Sandra Villegas',o:'Electricidad',c:'Reparaciones',z:'Envigado',r:4.7,t:84,nv:'Plata',p:50000,y:5},
{id:'p4',n:'Lupita Salazar',o:'Belleza',c:'Personal',z:'Centro',r:4.9,t:54,nv:'Plata',p:45000,y:4},
{id:'p5',n:'Don Jairo',o:'Plomería',c:'Reparaciones',z:'Centro',r:4.9,t:310,nv:'Oro',p:80000,y:18}];
const PR=id=>PROS.find(p=>p.id===id)||{id:'',n:'',o:'',c:'',z:'',r:0,t:0,nv:'',p:0,y:0};
const LBL={buscando:'Buscando propuestas',asignado:'Pago pendiente',retenido:'Pago protegido',en_camino:'En camino',llego:'Llegó',en_proceso:'En proceso',finalizado:'Por aprobar',liberado:'Por calificar',calificado:'Completado',disputa:'En revisión'};
const DEST={buscando:'ruta',asignado:'pago',retenido:'ruta',en_camino:'ruta',llego:'ruta',en_proceso:'ruta',finalizado:'ruta',disputa:'ruta',liberado:'calificar',calificado:'completado'};
const STAGE={buscando:1,asignado:2,retenido:2,en_camino:3,llego:3,en_proceso:4,finalizado:4,disputa:4,liberado:5,calificado:5};
const AVANCE=['retenido','en_camino','llego','en_proceso','finalizado'];
const NEXT={retenido:'Salir hacia el cliente',en_camino:'Marcar llegada',llego:'Empezar trabajo',en_proceso:'Terminar trabajo'};
const REPLY=['Recibido, ya te respondo.','Claro, te confirmo en un momento.','Sí, llego a tiempo.'];
const MESES=['May','Jun','Jul','Ago','Sep','Oct'];
const INGRESOS=[40,55,48,70,62,90];
const NAVC=[{k:'home',l:'Inicio',i:'home',a:'root',x:'home'},{k:'trabajos',l:'Mis trabajos',i:'bag',a:'root',x:'trabajos'},{k:'plus'},{k:'buscar',l:'Búsqueda',i:'search',a:'root',x:'buscar'},{k:'perfil',l:'Perfil',i:'user',a:'root',x:'perfil'}];
const NAVP=[{k:'disp',l:'Inicio',i:'home',a:'navpro',t:'disp'},{k:'curso',l:'En curso',i:'bag',a:'navpro',t:'curso'},{k:'plus'},{k:'fin',l:'Finanzas',i:'wallet',a:'navpro',t:'fin'},{k:'properfil',l:'Perfil',i:'user',a:'root',x:'properfil'}];

function seed(){return{role:null,on:true,zona:'Laureles',
  jobs:[
   {id:'j1',t:'Cambio de grifo',c:'Reparaciones',z:'Laureles',v:112000,k:'Corto',pro:'p1',s:'retenido',chat:[{f:'c',m:'Hola, ¿me confirmas que llegas hoy?'},{f:'p',m:'Sí, llego a las 3. Mi número es 300 123 4567.'}]},
   {id:'j2',t:'Pintura de sala',c:'Hogar',z:'Belén',v:150000,k:'Mediano',pro:'p2',s:'calificado',n:5,chat:[]},
   {id:'j3',t:'Revisión de calentador',c:'Reparaciones',z:'Laureles',v:90000,k:'Corto',pro:'p1',cl:'Andrés M.',s:'calificado',n:5,chat:[]},
   {id:'j4',t:'Instalación de lámpara',c:'Reparaciones',z:'Envigado',v:70000,k:'Corto',pro:'p3',s:'disputa',chat:[],disp:'Lámpara mal anclada'}],
  req:[
   {id:'r1',t:'Fuga bajo el lavaplatos',c:'Reparaciones',z:'Laureles',b:100000,cl:'Camila T.',k:'Corto',km:'1,2 km',w:'Hoy · tarde',m:true,d:'Gotea constante, necesito solución hoy mismo si es posible.'},
   {id:'r2',t:'Cambiar calentador viejo por uno nuevo',c:'Reparaciones',z:'Envigado',b:180000,cl:'Andrés M.',k:'Largo',km:'4,8 km',w:'Sábado · mañana',m:false,d:'Ya tengo el calentador nuevo, solo instalación y descarte del viejo.'},
   {id:'r3',t:'Revisión de presión en 2 baños',c:'Reparaciones',z:'Belén',b:90000,cl:'Laura P.',k:'Corto',km:'3,1 km',w:'Flexible',m:false,d:'La ducha del segundo baño salió con poca presión después de una remodelación.'}],
  wal:{saldo:186000,pend:112000}};}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

let st=[{v:'splash',p:{}}],splashT=0,starN=5,lastY=0;
const cur=()=>st[st.length-1];
const go=(v,p={})=>{st.push({v,p});render()};
const root=(v,p={})=>{st=[{v,p}];render()};
const back=()=>{if(st.length>1)st.pop();render()};
const swap=(v,p={})=>{st.pop();go(v,p)};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2800)}
function openSheet(h){const s=document.getElementById('sheet');s.innerHTML=`<div class="panel">${h}</div>`;s.classList.add('on')}
function closeSheet(){document.getElementById('sheet').classList.remove('on')}

const hdr=(t,sub,bk=true,right='')=>`<header class="hd">${bk?`<button class="ico" data-a="back" aria-label="Volver">${I('back')}</button>`:''}<div class="grow"><h1>${t}</h1>${sub?`<small>${sub}</small>`:''}</div>${right}</header>`;
const av=(p,s=44)=>`<span class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.36)}px">${ini(p.n||'?')}</span>`;
const job=id=>S.jobs.find(j=>j.id===id);
const proRow=p=>`<div class="glass pc clk" data-a="go" data-x="ficha" data-id="${p.id}">${av(p,50)}<div class="grow"><b>${p.n} ${VER}</b><small>${p.o} · ${p.z} · ${p.y} años</small><small>${p.r}★ · ${p.t} trabajos</small></div><div class="right"><b>${M(p.p)}</b><small>precio base</small><span class="tag">${p.nv}</span></div></div>`;
const jobCard=j=>`<div class="glass pc clk" data-a="jobgo" data-id="${j.id}"><div class="grow"><b>${esc(j.t)}</b><small>${esc(PR(j.pro).n||'Buscando profesional')} · ${M(j.v)}</small></div><span class="tag">${LBL[j.s]}</span></div>`;
const chartSVG=()=>{const H=140,W=310,pts=INGRESOS.map((v,i)=>[(i+.5)*W/6,H-v*H/100]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path class="ln" pathLength="1" d="${d}"/>${pts.map((p,i)=>`<circle class="dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===5?5:3.5}" style="animation-delay:${.4+i*.2}s"/>`).join('')}</svg>`};
const barsHTML=()=>`<div class="chart">${INGRESOS.map((v,i)=>`<div class="b ${i===5?'hi':''}" style="--i:${i};--h:${v}%"></div>`).join('')}${chartSVG()}</div><div class="months">${MESES.map((m,i)=>`<span class="${i===5?'b':''}">${m}</span>`).join('')}</div>`;

const VIEWS={
splash:()=>`<div class="ctr full intro" data-a="root" data-x="bienvenida">${HERO(240)}${WM()}<p class="mut fade">Luz y servicios en un clic · toca para entrar</p></div>`,

bienvenida:p=>`<div class="ctr full">${HERO(180,true)}${WM('sm')}<p class="mut txtc">Pago protegido, profesionales verificados y garantía de 2 días.</p><div class="stack">${cta('Continuar con Google','google','',p.st)}<span class="pill" style="align-self:center">Versión demo · datos de prueba</span></div><div class="legal"><span>Términos</span><span>Privacidad</span><button class="link" data-a="reset">Reiniciar demo</button></div></div>`,

rol:()=>`${hdr('¿Cómo usarás Rebuske?','Puedes cambiarlo después en tu perfil',false)}
<button class="glass" data-a="rol" data-x="cliente"><span class="ibox">${I('search',22)}</span><div class="grow"><b>Necesito que me resuelvan algo</b><small>Publica una solicitud y compara propuestas verificadas.</small></div></button>
<button class="glass" data-a="rol" data-x="profesional"><span class="ibox">${I('bolt',22)}</span><div class="grow"><b>Quiero ofrecer mi oficio</b><small>Recibe solicitudes de tu zona y cobra con pago protegido.</small></div></button>`,

home:()=>{const act=S.jobs.filter(j=>!j.cl&&j.s!=='calificado'&&j.s!=='disputa');return `
<header class="hd">${LZ('lg')}<div class="grow"><h1>Hola, Camila</h1><small>${S.zona}, Medellín · cuenta familiar</small></div><button class="ico" data-a="root" data-x="trabajos" aria-label="Notificaciones">${I('bell',20)}<i class="bdot"></i></button></header>
<button class="search" data-a="go" data-x="buscar">${I('search',18)}<span class="mut">¿Qué necesitas resolver?</span></button>
<div class="zones">${ZONAS.slice(0,5).map(z=>`<button class="chip2 ${S.zona===z?'on':''}" data-a="zona" data-x="${z}">${z}</button>`).join('')}</div>
<h2>Categorías <button class="link" data-a="go" data-x="buscar">Ver todas</button></h2>
<div class="vault">${CATS.map(c=>`<button class="vc" data-a="go" data-x="buscar" data-c="${c[0]}"><i>${I(c[1],24)}</i><span>${c[0]}</span></button>`).join('')}</div>
<div class="glass banner">${LZ()}<div class="grow"><b>Pago protegido Rebuske</b><small>Tu plata queda retenida y solo se libera cuando confirmas que el trabajo quedó bien.</small></div>${I('chev',18)}</div>
${act.length?`<h2>Tu trabajo</h2>${act.slice(0,2).map(jobCard).join('')}`:''}
<h2>Destacados cerca de ti</h2>${PROS.slice(0,3).map(proRow).join('')}`},

buscar:p=>{const cat=p.cat||'';return `${hdr('Búsqueda','profesionales cerca de ti',false)}
<label class="sr">${I('search',18)}<input id="sq" placeholder="Busca por oficio o nombre" value="${esc(p.q||'')}" autocomplete="off"></label>
<div class="frow"><select id="fc" class="sel">${['Todas las categorías',...CATS.map(c=>c[0])].map(o=>`<option ${(o===(cat||'Todas las categorías'))?'selected':''}>${o}</option>`).join('')}</select><select id="fo" class="sel">${[['valorados','Mejor valorados'],['precio','Precio menor'],['trabajos','Más trabajos']].map(o=>`<option value="${o[0]}" ${(p.o||'valorados')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
<div class="glass refp"><b>Precios de referencia${cat?' · '+cat:''}</b><small>Rangos orientativos (datos de prueba)</small><div class="rows" style="margin-top:8px">${REF.map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div></div>
<div id="lista">${listaHTML(p)}</div>`},

ficha:p=>{const x=PR(p.id);return `${hdr('Perfil profesional')}
<div class="glass ficha">${av(x,70)}<h1>${x.n} ${VER}</h1><small>${x.o} · ${x.y} años de experiencia</small><div class="tags" style="justify-content:center"><span class="tag">✓ Verificado</span><span class="tag2">${x.nv}</span></div></div>
<div class="stats3"><div class="glass"><b>${x.r}</b><small>★★★★★</small></div><div class="glass"><b>${x.t}</b><small>trabajos</small></div><div class="glass"><b>12 min</b><small>responde en</small></div></div>
<h2>Sobre mí</h2><p class="glass txt">${x.o} certificado. Cotizo antes de empezar, con garantía escrita de 2 días y precio claro desde el principio.</p>
<h2>Especialidades</h2><div class="chips">${['Fugas','Calentadores','Destapes','Tuberías PEX','Laureles'].map(t=>`<span class="chip">${t}</span>`).join('')}</div>
<h2>Portafolio <small>trabajos reales</small></h2><div class="port"><div>Instalación</div><div>Reparación</div><div>Mantenimiento</div><div>Proyecto</div></div>
<div class="sticky row2"><button class="btn ghost" data-a="chatnew">Ver chat</button><button class="btn sheen" data-a="go" data-x="solicitud" data-id="${x.id}">Solicitar servicio · ${M(x.p)}</button></div>`},

solicitud:p=>{const x=PR(p.id),cat=p.cat||x.c||'Reparaciones',b=p.b||x.p||60000,z=p.z||S.zona;return `${hdr('Nueva solicitud','Describe lo que necesitas')}
<label>Categoría<select id="sc" class="sel">${CATS.map(c=>`<option ${c[0]===cat?'selected':''}>${c[0]}</option>`).join('')}</select></label>
<label>Describe el problema<textarea id="sd" rows="3" placeholder="Ej: el lavaplatos bota agua por debajo">${esc(p.t||'')}</textarea></label>
<label>Zona<select id="sz" class="sel">${ZONAS.map(k=>`<option ${k===z?'selected':''}>${k}</option>`).join('')}</select></label>
<small>Tipo de trabajo</small>
<div class="seg">${['Corto','Mediano','Largo'].map(s=>`<button data-a="seg" class="${(p.k||'Corto')===s?'on':''}">${s}</button>`).join('')}</div>
<label>Presupuesto (COP)<input id="sb" class="field" type="number" inputmode="numeric" value="${b}"></label>
<div class="glass sum"><div><span>Tu presupuesto</span><b id="sbv">${M(b)}</b></div><small>La comisión del 7% la paga el profesional al liberar el pago. Nunca se suma a tu cuenta.</small></div>
<div class="sticky"><button class="btn sheen" data-a="publicar">Publicar solicitud gratis</button></div>`},

ruta:p=>{const j=job(p.id);if(!j)throw 0;const x=PR(j.pro),sg=STAGE[j.s]||0,pct=sg/5*100;const pend=j.s==='buscando';
const nodos=[['Solicitud publicada','hace 3 minutos'],['Propuestas recibidas',`${(j.props||[]).length} propuestas comparables`],['Profesional elegido',x.n||'—'],['En camino','Seguimiento activo de la Ruta de Luz'],['Trabajando','El profesional está en tu domicilio'],['Pago liberado','Comprobante y calificación']];
return `${hdr('Ruta de Luz',j.t)}
<div class="ctr sm">${HERO(pend?150:120,pend)}<h2 style="justify-content:center">${pend?'Buscando profesional disponible…':LBL[j.s]}</h2><small>${j.z} · publicado hace 3 minutos</small></div>
<div class="glass tl"><div class="fill" style="--h:${Math.max(0,pct-4)}%"></div>${nodos.map((n,i)=>`<div class="st ${sg>=i?'on':''}"><span class="nd"></span><div><b>${n[0]}</b><small>${n[1]}</small></div></div>`).join('')}</div>
${pend?`<h2>Propuestas comparables <small>elige con calma</small></h2>${(j.props||[]).map((o,i)=>{const px=PR(o.pro),tg=[i===0&&'Mejor mezcla',o.p===Math.min(...j.props.map(z=>z.p))&&'Más económica',px.r===Math.max(...j.props.map(z=>PR(z.pro).r))&&'Mejor calificada'].filter(Boolean);return `<div class="glass pcard" style="--d:${i}">${av(px,46)}<div class="grow"><b>${px.n} ${VER}</b><small>${px.o} · ${px.r}★ · ${px.t} trabajos</small><p class="msg">"${esc(o.m)}"</p><div class="tags">${tg.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div class="right"><b>${M(o.p)}</b><button class="btn sm" data-a="elegir" data-j="${j.id}" data-id="${px.id}" data-pr="${o.p}">Elegir</button></div></div>`}).join('')}
<small class="txtc">Puedes elegir cuando quieras. Nadie cobra hasta que apruebes.</small>`:`<div class="glass pc">${av(x,48)}<div class="grow"><b>${x.n} ${VER}</b><small>${x.o} · ${x.z}</small></div><span class="tag">${x.nv}</span></div>
<div class="track"><i style="--w:${pct}%"></i></div>
${j.s==='disputa'?`<div class="glass warnc">${I('shield',18)}<small><b>Ticket abierto.</b> El pago sigue congelado mientras lo revisamos.</small></div>`:''}
${j.s==='finalizado'?`<div class="glass warnc">${I('shield',18)}<small><b>Garantía activa:</b> tienes 2 días para reportar un problema antes de liberar el pago.</small></div>`:''}
<div class="sticky row2"><button class="btn ghost" data-a="go" data-x="chat" data-id="${j.id}">Chat</button>${j.s==='finalizado'?`<button class="btn sheen" data-a="sheetLib" data-id="${j.id}">Aprobar y liberar</button>`:(j.s==='disputa'?`<button class="btn" data-a="back">Volver</button>`:`<button class="btn" data-a="avanzar" data-id="${j.id}">Siguiente paso (demo)</button>`)}</div>
${AVANCE.includes(j.s)?`<button class="link center" data-a="sheetRep" data-id="${j.id}">Reportar un problema</button>`:''}`}`},

pago:p=>{const j=job(p.id);if(!j)throw 0;const x=PR(j.pro),c=com(x.nv);const pagado=j.s!=='asignado';return `${hdr('Pago protegido','Tu plata queda guardada')}
<div class="glass center">${I('shield',32)}<small>Total a pagar</small><b class="big lima">${RL(M(j.v))}</b><small>${pagado?'Retenido. El profesional no puede tocarlo hasta que apruebes.':'Se libera solo cuando apruebes el trabajo.'}</small></div>
<h2>Método de pago</h2><div class="seg">${['Visa 4242','Nequi','PSE'].map((m,i)=>`<button data-a="seg" class="${i===0?'on':''}">${m}</button>`).join('')}</div>
<h2>Desglose transparente</h2><div class="glass rows"><div><span>Valor acordado</span><b>${M(j.v)}</b></div><div><span>Para ${x.n.split(' ')[0]} al liberar</span><b class="lima">${M(j.v*(1-c))}</b></div><div><span>Comisión Rebuske (${Math.round(c*100)}%)</span><b>${M(j.v*c)}</b></div></div>
<small>La comisión la paga el profesional. Tú no pagas nada extra.</small>

function bindVault(){const v=q('.vault');if(!v)return;const upd=()=>{const c=v.getBoundingClientRect(),mid=c.left+c.width/2;v.querySelectorAll('.vc').forEach(el=>{const r=el.getBoundingClientRect(),d=Math.min(1,Math.abs(r.left+r.width/2-mid)/(c.width/2));el.style.setProperty('--s',(1-d*.14).toFixed(3));el.style.setProperty('--o',(1-d*.45).toFixed(3))})};v.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});requestAnimationFrame(upd)}

function render(){
  const c=cur();let h;
  try{h=VIEWS[c.v](c.p)}catch(e){h='<div class="ctr full"><h2>Este trabajo ya no está disponible</h2><button class="btn" data-a="root" data-x="home">Volver al inicio</button></div>'}
  const v=document.getElementById('view');v.innerHTML=h;v.scrollTop=0;lastY=0;
  const items=navFor(c.v),nav=document.getElementById('nav');
  nav.innerHTML=items?navHTML(c.v,items):'';
  if(!items)nav.classList.remove('min');
  rollInit();bindVault();
  if(c.v==='splash'&&!splashT)splashT=setTimeout(()=>{splashT=0;if(cur().v==='splash')root('bienvenida')},3000);
}

function sendMsg(id,text){
  const j=job(id);if(!j||!text)return;
  j.chat.push({f:'c',m:text});save();j.typing=true;render();
  setTimeout(()=>{j.typing=false;j.chat.push({f:'p',m:REPLY[Math.floor(Math.random()*REPLY.length)]});save();if(cur().v==='chat')render()},1400);
}
function flow(a,d,after){const p=cur().p;if(p.st)return;p.st='load';render();setTimeout(()=>{p.st='done';render();setTimeout(after,800)},1100)}
